#Section dataprocessing 

dataprocessing : 
  output_path : "/data/output"
  dsm_path : 
  dataset_path : 
  remove_nc_file : False
  roi_gpkg : "/data/input/roi_cercey.gpkg"
  start_date : "2023-07-28"
  end_date : "2023-08-05" 
  id_feature_swot : 2320106762
  classes_to_keep :
  - 4
  - 1
  - 2
  - 3
  convert_to_crs : "EPSG:2154"
  min_wse : 376
  max_wse : 385
  land_phase_shift : 0.5

#Section train  

train: 
  seed : 1
  bayesian_model : True
  monitor_every_epoch : 10
  ground_model: garf
  x_freq_enc_dim : # for mlp relu
  width1 : 16
  depth1 : 4
  gaussian_act_sigma: 0.1 # for garf
  weighted_by_phase_noise: True
  weighted_function : inverse
  water_model : mlp
  width2 : 16
  depth2 : 4
  softmax_factor :
  water_probability: gaussian
  ground_probability: cauchy
  n_epochs : 10000
  plot_every_epoch: 500
  n_epochs_wloss: 5500
  lambda_wloss: 20 
  lambda_label : 1
  n_epochs_uncert: 
  lambda_uncert: 
  optimizer_name : "Adam" 
  lr : 0.005
  wl_optimizer_name : "AdamW" 
  wl_lr : 0.0005 
  confidence_threshold: 0.999
  save_model_epoch : 

#Section Inference
inference : 
  plot_density : 128
  fig_size : 5
  vt_path: /data/input/df_cercey.csv
  max_wse_for_X_plot: 400
  min_wse_for_dsm : 377
  max_wse_for_dsm : 384
  chosen_time_for_dsm: 1 
  water_threshold_proba : 0.99
  ground_threshold_proba : 0.1
  surface_inference : bayesian # mean / bayesian
  volume_inference : bayesian # mean / bayesian
  p_w_filter : 0.8

  
task_retry_limits: 
  allowed_retry: 0
  maximum_ram: 180.0
  maximum_cpu": 40

slurm: 
  account: "campus"

builders: {}

